
name: Bootstrap Personal Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check prerequisites
        env:
          GH_TOKEN: ${{ secrets.VOLTA_SECRETS_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Bootstrap token is missing"
            exit 1
          fi

          existing="$(gh secret list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name')"

          for name in VOLTA_KEYSTORE_BASE64 VOLTA_STORE_PASSWORD VOLTA_KEY_ALIAS VOLTA_KEY_PASSWORD; do
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              echo "::error::Signing secret already exists. Refusing to overwrite."
              exit 1
            fi
          done

      - name: Generate permanent signing key
        env:
          GH_TOKEN: ${{ secrets.VOLTA_SECRETS_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/volta-personal-release.jks"
          STORE_PASSWORD="$(openssl rand -hex 32)"
          KEY_PASSWORD="$(openssl rand -hex 32)"
          KEY_ALIAS="volta-personal"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 3072 -validity 10000 \
            -dname "CN=Volta Personal Build, OU=Personal, O=Private, C=IN"

          base64 -w0 "$KEYSTORE" |
            gh secret set VOLTA_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"

          printf '%s' "$STORE_PASSWORD" |
            gh secret set VOLTA_STORE_PASSWORD --repo "$GITHUB_REPOSITORY"

          printf '%s' "$KEY_ALIAS" |
            gh secret set VOLTA_KEY_ALIAS --repo "$GITHUB_REPOSITORY"

          printf '%s' "$KEY_PASSWORD" |
            gh secret set VOLTA_KEY_PASSWORD --repo "$GITHUB_REPOSITORY"

          echo "Permanent signing secrets saved successfully."

      - name: Delete temporary bootstrap token
        if: success()
        env:
          GH_TOKEN: ${{ secrets.VOLTA_SECRETS_BOOTSTRAP_TOKEN }}
        run: |
          gh secret delete VOLTA_SECRETS_BOOTSTRAP_TOKEN \
            --repo "$GITHUB_REPOSITORY"
